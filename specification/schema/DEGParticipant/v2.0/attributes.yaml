openapi: 3.1.1
info:
  title: DEG — Participant Attributes (v2.0)
  version: 2.0.0
  description: >
    Participant attributes for DEG energy contracts. Identifies the
    participant's role in the contract (buyer/seller) and optional
    role-specific inputs.

components:
  schemas:
    DEGParticipant:
      type: object
      additionalProperties: true
      required: [role]
      x-jsonld:
        "@context": ./context.jsonld
        "@type": DEGParticipant
      properties:
        role:
          type: string
          enum: [buyer, seller]
          description: >
            The participant's role in the contract.
            buyer = entity procuring flex (typically the utility/DISCOM).
            seller = entity providing flex (typically the aggregator).
        roleInputs:
          type: object
          additionalProperties: true
          description: >
            Optional role-specific inputs consumed by the contract policy.
            Contents vary by contract type and role.
