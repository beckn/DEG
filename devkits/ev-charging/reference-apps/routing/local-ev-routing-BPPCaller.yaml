# Apps mode: callbacks go to the BAP; catalog publishing goes to the local discovery
# service (the CPO platform's own receiver) instead of the hosted fabric catalog service.
routingRules:
  - version: "2.0.0"
    targetType: "bap"
    endpoints:
      - on_discover
      - on_select
      - on_init
      - on_confirm
      - on_status
      - on_update
      - on_cancel
      - on_track
      - on_rate
      - on_support

  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://beckn-router:9000/bpp/receiver"
    endpoints:
      - catalog/publish
      - catalog/on_publish
