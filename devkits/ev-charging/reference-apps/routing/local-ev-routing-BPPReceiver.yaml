# Apps mode: every request (including discover and catalog publishing for the local
# discovery service) is handled by the CPO platform reference app.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://sandbox-bpp:3002/api/webhook"
    endpoints:
      - discover
      - select
      - init
      - confirm
      - status
      - track
      - cancel
      - update
      - rate
      - support
      - catalog/publish
      - catalog/on_publish
