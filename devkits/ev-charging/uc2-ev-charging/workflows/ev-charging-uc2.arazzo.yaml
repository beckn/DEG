arazzo: 1.0.1
info:
  title: EV Charging uc2 — Settlement-first Workflow
  version: 1.0.0
  description: >
    End-to-end Beckn 2.0 LTS workflows for settlement-first EV charging
    (see ../DESIGN.md). EcoPower publishes a charging pool with a WALK_IN and
    a RESERVATION offer; a driver app discovers, books a reservation, and the
    CPO pushes the session ledger. When the ledger reaches a terminal state,
    the contractpolicyenforcer computes itemised revenue flows from the
    shared contract policy — on the CPO side and again on the driver side.

    select / init / confirm / cancel callbacks are generated by sandbox-bpp
    from ../responses/bpp/*.json, so a passing run also proves those
    fixtures clear the BPP caller and BAP receiver (schema, network policy,
    contract policy).

    Run via the wrapper (patches bapUri/bppUri and checks for NACKs):
      ./run-arazzo.sh                       # all workflows
      ./run-arazzo.sh -w reservation-session -v

    Available workflows: publish-catalog, discover, reservation-session,
      walk-in-session, reservation-cancellation, reservation-too-soon,
      early-no-show

sourceDescriptions:
  - name: beckn-bap-caller
    type: openapi
    url: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
    x-serverUrl: http://localhost:8081/bap/caller

  - name: beckn-bpp-caller
    type: openapi
    url: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
    x-serverUrl: http://localhost:8082/bpp/caller

workflows:
  # ── Catalog & discovery ──

  - workflowId: publish-catalog
    summary: CPO publishes a charging pool with WALK_IN and RESERVATION offers
    steps:
      - stepId: publish-catalog
        description: Offers carry mode, terms and the contract policy reference
        operationId: beckn-bpp-caller.catalogPublish
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/publish-catalog.json"

  - workflowId: discover
    summary: Driver app discovers CCS2 pools offering reservations
    steps:
      - stepId: discover
        operationId: beckn-bap-caller.discover
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/discover-request.json"

  # ── Reservation: book → queue → assigned late → settled (DESIGN.md §8.1) ──

  - workflowId: reservation-session
    summary: Reservation booked, stall assigned 12 min late, grid and CPO limits, settled at 600.00 INR
    steps:
      - stepId: select
        description: Chosen offer copied verbatim; pool by id with 30 kWh; vehicle and reservedStart added
        operationId: beckn-bap-caller.select
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/select-request.json"

      - stepId: init
        description: The on_select contract (with the CPO quote) sent back unchanged
        operationId: beckn-bap-caller.init
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/init-request.json"

      - stepId: confirm
        description: The on_init contract sent back unchanged; on_confirm opens the ledger with QUEUED
        operationId: beckn-bap-caller.confirm
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/confirm-request.json"

      - stepId: on-status-assigned
        description: CPO assigns stall A1 at 18:12, 12 min after the reserved start
        operationId: beckn-bpp-caller.onStatus
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/on-status-response-assigned.json"

      - stepId: on-status-settled
        description: >
          Terminal ledger (DEPARTED). Revenue flows are injected at the BPP
          caller and recomputed at the BAP receiver: energy 558, occupancy 62,
          idle 40, CPO delay credit −55, grid delay credit −5 → driver pays 600.00.
        operationId: beckn-bpp-caller.onStatus
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/on-status-response-settled.json"

  # ── Walk-in: demotion, charging, idle ──

  - workflowId: walk-in-session
    summary: Walk-in demoted once, charged 24 kWh, idled 8 min, settled at 522.00 INR
    steps:
      - stepId: on-status-walk-in-settled
        description: energy 432, occupancy 60, idle 30 (3 min beyond grace)
        operationId: beckn-bpp-caller.onStatus
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/on-status-response-walk-in-settled.json"

  # ── Reservation cancelled after the free-cancellation window closed ──

  - workflowId: reservation-cancellation
    summary: Driver cancels 30 min before the reserved start; the 100.00 INR fee is forfeited
    steps:
      - stepId: cancel
        description: Confirmed contract sent back; on_cancel ends the ledger CANCELLED and settles the fee
        operationId: beckn-bap-caller.cancel
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/cancel-request.json"

  # ── Policy enforcement (expected NACKs) ──

  - workflowId: reservation-too-soon
    summary: >
      Negative path — network policy N3: a reservation 40 min ahead is below
      the network's 60 min minimum lead time, so the driver's own adapter
      NACKs the select before it leaves.
    steps:
      - stepId: select-too-soon
        operationId: beckn-bap-caller.select
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/select-request-reservation-too-soon.json"
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: early-no-show
    summary: >
      Negative path — contract policy C2: the CPO declares NO_SHOW after one
      demotion while the offer allows two, so the CPO's adapter NACKs its
      own on_status and the invalid ledger never reaches the driver.
    steps:
      - stepId: on-status-early-no-show
        operationId: beckn-bpp-caller.onStatus
        requestBody:
          contentType: application/json
          payload:
            $ref: "../examples/on-status-response-early-no-show.json"
        successCriteria:
          - condition: $statusCode == 400
