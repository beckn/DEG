# Apps mode: replace the fixture mocks with the reference apps (consumer app on :3001,
# CPO platform on :3002) and route discovery and catalog publishing locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d
#   open http://localhost:3001   (consumer app)   http://localhost:3002   (CPO operations)
#   python3 ../reference-apps/scenarios/run-usecases.py
#
# Service names stay sandbox-bap / sandbox-bpp so the adapters' receiver routing is unchanged.
services:
  onix-bap:
    volumes:
      - ../config:/app/config
      - ../schemas:/app/schemas
      - ../reference-apps/routing/local-ev-routing-BAPCaller.yaml:/app/config/local-ev-routing-BAPCaller.yaml:ro

  onix-bpp:
    volumes:
      - ../config:/app/config
      - ../schemas:/app/schemas
      - ../reference-apps/routing/local-ev-routing-BPPReceiver.yaml:/app/config/local-ev-routing-BPPReceiver.yaml:ro
      - ../reference-apps/routing/local-ev-routing-BPPCaller.yaml:/app/config/local-ev-routing-BPPCaller.yaml:ro

  sandbox-bap:
    image: python:3.12-slim
    platform: !reset null
    working_dir: /app/bap-app
    command: ["python3", "-u", "app.py"]
    environment:
      - PORT=3001
      - ONIX_BAP_CALLER=http://onix-bap:8081/bap/caller
      - BAP_ID=bap.example.com
      - BAP_URI=http://beckn-router:9000/bap/receiver
    volumes:
      - ../reference-apps:/app:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sandbox-bpp:
    image: python:3.12-slim
    platform: !reset null
    working_dir: /app/cpo-app
    command: ["python3", "-u", "app.py"]
    environment:
      - PORT=3002
      - ONIX_BPP_CALLER=http://onix-bpp:8082/bpp/caller
      - BPP_ID=bpp.example.com
      - BPP_URI=http://beckn-router:9000/bpp/receiver
      - CPO_PUBLIC_URL=http://localhost:3002
      - CATALOG_FILES=/examples/02_on_discover/ev-charging-discovery-catalog.json,/examples/02_on_discover/ev-charging-specific-evse-catalog.json
    volumes: !override
      - ../reference-apps:/app:ro
      - ../uc1-ev-charging/examples:/examples:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
