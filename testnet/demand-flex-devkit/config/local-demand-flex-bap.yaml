# =============================================================================
# Demand-flex devkit — BAP ONIX adapter (Beckn Protocol API v2.0.0)
# =============================================================================
# Transport contract (paths, Ack/Nack, Signature / CounterSignature): OpenAPI at
#   schemaValidator.location → beckn/protocol-specifications-v2 …/api/v2.0.0/beckn.yaml
# Inbound requests MUST include HTTP Authorization with Beckn HTTP Signature
#   (Ed25519 + BLAKE digest over the body). Outbound calls from this adapter use
#   the signer plugin to attach that header.
#
# Receiver (/bap/receiver/): validateSign → checkPolicy → addRoute → validateSchema
#   Verifies peer signature, applies DEG network policy, routes, then validates
#   body against v2 + extended DEG schemas (context.schemaContext).
# Caller (/bap/caller/): validateSchema → checkPolicy → addRoute → sign
#   Validates before send, then signs every forwarded request to BPP/sandbox.
#
# Sync HTTP responses follow Ack per the same OpenAPI (status + signature field
# for counter-signature where the adapter implements it). Details: same repo
# api/v2.0.0/README.md “Security and acknowledgments”.
# =============================================================================
appName: "onix-local"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8081
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins
modules:
  - name: bapTxnReceiver
    path: /bap/receiver/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://api.dev.beckn.io/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            # Reusing signing keys from p2p-trading devkit
            networkParticipant: p2p-trading-sandbox1.com
            keyId: 76EU8aUqHouww7gawT6EibH4bseMCumyDv3sgyXSKENGk8NDcdVwmQ
            signingPrivateKey: Pc6dkYo5LeP0LkwvZXVRV9pcbeh8jDdtdHWymID5cjw=
            signingPublicKey: KVYEWkQB2WwnttVMWfy7KrnqiD51ZDvi8vfCac2IwRE=
            encrPrivateKey: Pc6dkYo5LeP0LkwvZXVRV9pcbeh8jDdtdHWymID5cjw=
            encrPublicKey: KVYEWkQB2WwnttVMWfy7KrnqiD51ZDvi8vfCac2IwRE=
        # Beckn Protocol API v2.0.0 — request/response shapes, Ack, Authorization
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/draft/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
            # BDR context.jsonld URLs to list in context.schemaContext when messages use EnergyEvent / EnergyEventParticipation / EnergyEventMeasurement / EnergySettlement:
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEvent/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventParticipation/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventMeasurement/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergySettlement/v2.0/context.jsonld
        checkPolicy:
          id: opapolicychecker
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/policies/demand_flex_network.rego"
            query: "data.deg.policy.demand_flex_network.violations"
            refreshIntervalSeconds: "300"
        cache:
          id: cache
          config:
            addr: redis:6379
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: ./config/local-demand-flex-routing-BAP-Receiver.yaml
        middleware:
          - id: reqpreprocessor
            config:
              uuidKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSign
        - checkPolicy
        - addRoute
        - validateSchema

  - name: bapTxnCaller
    path: /bap/caller/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://api.dev.beckn.io/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            networkParticipant: p2p-trading-sandbox1.com
            keyId: 76EU8aUqHouww7gawT6EibH4bseMCumyDv3sgyXSKENGk8NDcdVwmQ
            signingPrivateKey: Pc6dkYo5LeP0LkwvZXVRV9pcbeh8jDdtdHWymID5cjw=
            signingPublicKey: KVYEWkQB2WwnttVMWfy7KrnqiD51ZDvi8vfCac2IwRE=
            encrPrivateKey: Pc6dkYo5LeP0LkwvZXVRV9pcbeh8jDdtdHWymID5cjw=
            encrPublicKey: KVYEWkQB2WwnttVMWfy7KrnqiD51ZDvi8vfCac2IwRE=
        # Beckn Protocol API v2.0.0 — request/response shapes, Ack, Authorization
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/draft/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
            # BDR context.jsonld URLs to list in context.schemaContext when messages use EnergyEvent / EnergyEventParticipation / EnergyEventMeasurement / EnergySettlement:
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEvent/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventParticipation/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventMeasurement/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergySettlement/v2.0/context.jsonld
        checkPolicy:
          id: opapolicychecker
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/policies/demand_flex_network.rego"
            query: "data.deg.policy.demand_flex_network.violations"
            refreshIntervalSeconds: "300"
        cache:
          id: cache
          config:
            addr: redis:6379
        router:
          id: router
          config:
            routingConfig: ./config/local-demand-flex-routing-BAP-Caller.yaml
        signer:
          id: signer
        middleware:
          - id: reqpreprocessor
            config:
              uuidKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSchema
        - checkPolicy
        - addRoute
        - sign
