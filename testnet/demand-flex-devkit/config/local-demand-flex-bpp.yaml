# =============================================================================
# Demand-flex devkit — BPP ONIX adapter (Beckn Protocol API v2.0.0)
# =============================================================================
# Transport contract (paths, Ack/Nack, Signature / CounterSignature): OpenAPI at
#   schemaValidator.location → beckn/protocol-specifications-v2 …/api/v2.0.0/beckn.yaml
# Inbound requests MUST include HTTP Authorization with Beckn HTTP Signature.
# Outbound callbacks from this adapter use the signer plugin on /bpp/caller/.
#
# Receiver (/bpp/receiver/): validateSign → checkPolicy → addRoute → validateSchema
#   Verifies BAP/sandbox signature, DEG policy, routes, v2 + extended DEG schema.
# Caller (/bpp/caller/): validateSchema → checkPolicy → addRoute → sign
#   Includes revenueflows middleware on on_status before sign (policy-driven M&V).
#
# See protocol-specifications-v2 api/v2.0.0/README.md — requests signed; Ack
# carries counter-signature per spec where implemented by the adapter runtime.
# =============================================================================
appName: "onix-local"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8082
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins
modules:
  - name: bppTxnReceiver
    path: /bpp/receiver/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://api.dev.beckn.io/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            # Reusing signing keys from p2p-trading devkit (BPP keys)
            networkParticipant: p2p-trading-sandbox2.com
            keyId: 76EU7Mvhh7jaEf7Lcac5R1PPeFL4ddr1ALs2QYzpyTRE8g15Yr1p7C
            signingPrivateKey: AC72WfPu5ly3T7rXfRHrLA/l++BxbsNwe0qitgT9u6U=
            signingPublicKey: E9w4QejjJ6d+VODJlDKJcpI93RY3Bg4RQp4Rs1F9oQ8=
            encrPrivateKey: AC72WfPu5ly3T7rXfRHrLA/l++BxbsNwe0qitgT9u6U=
            encrPublicKey: E9w4QejjJ6d+VODJlDKJcpI93RY3Bg4RQp4Rs1F9oQ8=
        # Beckn Protocol API v2.0.0 — request/response shapes, Ack, Authorization
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/draft/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
            # BDR context.jsonld URLs to list in context.schemaContext when messages use EnergyEvent / EnergyEventParticipation / EnergyEventMeasurement / EnergySettlement:
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEvent/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventParticipation/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventMeasurement/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergySettlement/v2.0/context.jsonld
        checkPolicy:
          id: opapolicychecker
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/policies/demand_flex_network.rego"
            query: "data.deg.policy.demand_flex_network.violations"
            refreshIntervalSeconds: "300"
        cache:
          id: cache
          config:
            addr: redis:6379
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: ./config/local-demand-flex-routing-BPP-Receiver.yaml
        middleware:
          - id: reqpreprocessor
            config:
              uuidKeys: transaction_id,message_id
              role: bpp
      steps:
        - validateSign
        - checkPolicy
        - addRoute
        - validateSchema

  - name: bppTxnCaller
    path: /bpp/caller/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://api.dev.beckn.io/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            networkParticipant: p2p-trading-sandbox2.com
            keyId: 76EU7Mvhh7jaEf7Lcac5R1PPeFL4ddr1ALs2QYzpyTRE8g15Yr1p7C
            signingPrivateKey: AC72WfPu5ly3T7rXfRHrLA/l++BxbsNwe0qitgT9u6U=
            signingPublicKey: E9w4QejjJ6d+VODJlDKJcpI93RY3Bg4RQp4Rs1F9oQ8=
            encrPrivateKey: AC72WfPu5ly3T7rXfRHrLA/l++BxbsNwe0qitgT9u6U=
            encrPublicKey: E9w4QejjJ6d+VODJlDKJcpI93RY3Bg4RQp4Rs1F9oQ8=
        # Beckn Protocol API v2.0.0 — request/response shapes, Ack, Authorization
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/draft/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
            # BDR context.jsonld URLs to list in context.schemaContext when messages use EnergyEvent / EnergyEventParticipation / EnergyEventMeasurement / EnergySettlement:
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEvent/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventParticipation/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergyEventMeasurement/v2.0/context.jsonld
            # https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/schema/EnergySettlement/v2.0/context.jsonld
        checkPolicy:
          id: opapolicychecker
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/DEG/refs/heads/deg-prime-mvp/specification/policies/demand_flex_network.rego"
            query: "data.deg.policy.demand_flex_network.violations"
            refreshIntervalSeconds: "300"
        cache:
          id: cache
          config:
            addr: redis:6379
        router:
          id: router
          config:
            routingConfig: ./config/local-demand-flex-routing-BPP-Caller.yaml
        signer:
          id: signer
        middleware:
          - id: reqpreprocessor
            config:
              uuidKeys: transaction_id,message_id
              role: bpp
          - id: revenueflows
            config:
              actions: "on_status"
              debugLogging: "true"
              allowedDomains: "raw.githubusercontent.com"
      steps:
        - validateSchema
        - checkPolicy
        - addRoute
        - sign
