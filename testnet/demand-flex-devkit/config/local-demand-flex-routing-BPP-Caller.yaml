# BPP Caller routing: on_* callbacks from BPP → BAP adapter
routingRules:
  - version: "2.0.0"
    targetType: "bap"
    # Fallback when context has no bap_uri (snake_case). Sandbox/JSON often only has bapUri (camelCase).
    target:
      url: "http://onix-bap:8081/bap/receiver"
    endpoints:
      - on_discover
      - on_select
      - on_init
      - on_confirm
      - on_status
      - on_update
      - on_cancel

  - version: "2.0.0"
    targetType: "url"
    target:
      # url: "https://34.93.141.21.sslip.io/beckn/catalog"
      url: "https://fabric.nfh.global/beckn/catalog"
    endpoints:
      - publish
