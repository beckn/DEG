# Build onix-adapter-deg from DEG (see DEG/build/Dockerfile.onix-adapter-deg + DEG/build/README.md).
# From this directory: docker compose -f docker-compose-demand-flex.yml up --build
# Rebuilds from scratch each time you pass --build (no_cache: true). Override paths if your layout differs:
#   DEG_ROOT=../../.. BECKN_ONIX_ROOT=../../../../beckn-onix docker compose -f docker-compose-demand-flex.yml up --build

x-onix-adapter-deg-build: &onix_adapter_deg_build
  context: ${DEG_ROOT:-../../../}
  dockerfile: build/Dockerfile.onix-adapter-deg
  additional_contexts:
    beckn-onix: ${BECKN_ONIX_ROOT:-../../../../beckn-onix}
  no_cache: true

services:
  # ============================================
  # Core Infrastructure Services
  # ============================================

  # Redis - Caching Service
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # Beckn Onix Adapters (demand-flex)
  # ============================================

  onix-bap:
    build:
      <<: *onix_adapter_deg_build
    image: ${ONIX_IMAGE:-onix-adapter-deg:demand-flex-devkit}
    pull_policy: never
    container_name: onix-bap
    networks:
      - beckn_network
    ports:
      - "8081:8081"
    environment:
      CONFIG_FILE: "/app/config/local-simple.yaml"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      REDIS_ADDR: redis:6379
      RABBITMQ_ADDR: rabbitmq:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    volumes:
      - ../config:/app/config
      - ../schemas:/app/schemas
      - ../policies:/app/policies
    command: ["./server", "--config=/app/config/local-demand-flex-bap.yaml"]

  onix-bpp:
    build:
      <<: *onix_adapter_deg_build
    image: ${ONIX_IMAGE:-onix-adapter-deg:demand-flex-devkit}
    pull_policy: never
    container_name: onix-bpp
    networks:
      - beckn_network
    ports:
      - "8082:8082"
    environment:
      CONFIG_FILE: "/app/config/local-simple.yaml"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      REDIS_ADDR: redis:6379
      RABBITMQ_ADDR: rabbitmq:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    volumes:
      - ../config:/app/config
      - ../schemas:/app/schemas
      - ../policies:/app/policies
    command: ["./server", "--config=/app/config/local-demand-flex-bpp.yaml"]

  # ============================================
  # Sandbox Applications
  # ============================================

  sandbox-bap:
    container_name: sandbox-bap
    image: fidedocker/sandbox-2.0:latest
    platform: linux/amd64
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - beckn_network

  sandbox-bpp:
    container_name: sandbox-bpp
    build:
      context: ../sandbox
      dockerfile: Dockerfile.bpp
    image: sandbox-bpp:demand-flex-devkit
    pull_policy: never
    platform: linux/amd64
    environment:
      - NODE_ENV=production
      - PORT=3002
      - PERSONA=bpp
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - beckn_network

networks:
  beckn_network:
    name: beckn_network
    driver: bridge
